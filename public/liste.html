<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Übersicht — ServiWeb Client-Map</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%230f766e'/></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn ghost" id="menu" title="Filter" aria-label="Filter ein-/ausblenden">☰</button>

      <div class="brand">ServiWeb <small>Client-Map</small></div>

      <nav class="nav">
        <a href="/">Karte</a>
        <a href="/liste.html" class="active">Liste</a>
      </nav>

      <div class="search">
        <input type="search" id="quick" placeholder="Name, Ort, Notiz …" autocomplete="off">

      <button class="btn" id="export">CSV exportieren</button>

      <div class="spacer"></div>
      <div class="stats" id="stats"></div>
    </header>

    <div class="workspace">
      <aside class="sidebar" id="filters"></aside>
      <div class="table-wrap" id="table-wrap"></div>
      <aside class="detail" id="detail"></aside>
    </div>
  </div>

  <script type="module" src="/js/liste.js"></script>
